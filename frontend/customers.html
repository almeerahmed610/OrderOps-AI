      content="width=device-width, initial-scale=1.0">

      href="css/app.css">

</head>

<body>

<aside class="sidebar">

<div class="logo">
Order<span>Ops</span> AI
</div>

<a class="nav-link"
href="dashboard.html">

href="customers.html">

onclick="logout();return false;">
🚪 Logout

</aside>


<main class="main">

<div class="topbar">

<div>

<h1 class="page-title">
Customers
</h1>

<div class="page-subtitle">
Manage your customer database
</div>

</div>

</div>


<div class="card">

<div class="card-header">

<h2 class="card-title">
Add Customer
</h2>

</div>


<form id="customerForm"
      class="form-grid">

<div class="field">

<label>
Name *
</label>

<input
id="name"
required
maxlength="150"
placeholder="Customer name">

</div>


<div class="field">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="customer@email.com">

</div>


<div class="field">

<label>
Phone
</label>

<input
id="phone"
placeholder="+92 300 1234567">

</div>


<div class="field">

<label>
Address
</label>

<input
id="address"
placeholder="Customer address">

</div>


<div class="actions">

<button
class="btn"
type="submit">

Add Customer

</button>

</div>

</form>

</div>


<div class="card">

<div class="toolbar">

<h2 class="card-title">
Customer List
</h2>

<input
id="search"
class="search"
placeholder="Search customer...">

</div>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>
<th>Action</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

</main>


<script src="js/api.js"></script>

<script>

let customers = [];


async function loadCustomers() {

    try {

        customers =
            await apiFetch(
                "/api/customers/"
            );

        render();

    }

    catch(error) {

        alert(error.message);

    }

}


function render() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        customers.filter(customer => {

            return (

                String(
                    customer.name || ""
                ).toLowerCase().includes(query)

                ||

                String(
                    customer.email || ""
                ).toLowerCase().includes(query)

                ||

                String(
                    customer.phone || ""
                ).toLowerCase().includes(query)

            );

        });


    document.getElementById(
        "rows"
    ).innerHTML = filtered.length

        ? filtered.map(customer => `

            <tr>

                <td>
                    ${customer.id}
                </td>

                <td>
                    <strong>
                    ${escapeHtml(
                        customer.name
                    )}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(
                        customer.email || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        customer.phone || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        customer.address || "-"
                    )}
                </td>

                <td>

                    <button
                    class="btn btn-danger"
                    onclick="deleteCustomer(${customer.id})">

                    Delete

                    </button>

                </td>

            </tr>

        `).join("")

        :

        `
            <tr>

                <td
                colspan="6"
                class="empty">

                No customers found.

                </td>

            </tr>
        `;

}


async function deleteCustomer(id) {

    if (
        !confirm(
            "Are you sure you want to delete this customer?"
        )
    ) {
        return;
    }


    try {

        await apiFetch(
            `/api/customers/${id}`,
            {
                method: "DELETE"
            }
        );


        await loadCustomers();

    }

    catch(error) {

        alert(error.message);

    }

}


document.getElementById(
    "customerForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        try {

            await apiFetch(
                "/api/customers/",
                {
                    method: "POST",

                    body: {

                        name:
                            document
                            .getElementById("name")
                            .value
                            .trim(),

                        email:
                            document
                            .getElementById("email")
                            .value
                            .trim() || null,

                        phone:
                            document
                            .getElementById("phone")
                            .value
                            .trim() || null,

                        address:
                            document
                            .getElementById("address")
                            .value
                            .trim() || null

                    }

                }
            );


            this.reset();

            await loadCustomers();

        }

        catch(error) {

            alert(error.message);

        }

    }
);


document.getElementById(
    "search"
).addEventListener(
    "input",
    render
);


if (requireAuth()) {
    loadCustomers();
}

</script>

</body>
</html>

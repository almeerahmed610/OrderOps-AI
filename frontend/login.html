<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | OrderOps AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                Segoe UI,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #172554 45%,
                    #0284c7 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 38px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #2563eb
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: 900;

            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 28px;
            color: #64748b;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #dbe3ec;
            border-radius: 11px;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #0284c7;

            box-shadow:
                0 0 0 3px rgba(2, 132, 199, 0.10);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #0284c7;

            font-weight: 700;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 50px;

            border: 0;
            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #2563eb
                );

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            display: none;

            background: #fef2f2;
            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 11px 12px;

            border-radius: 10px;

            margin-bottom: 16px;

            font-size: 13px;
        }

        .register {
            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 13px;
        }

        .register a {
            color: #0284c7;
            font-weight: 800;
            text-decoration: none;
        }

        .brand {
            text-align: center;

            margin-top: 20px;

            color: rgba(255,255,255,0.75);

            font-size: 12px;
        }

        @media(max-width: 480px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            OA
        </div>

        <h1>Welcome Back</h1>

        <div class="subtitle">
            Sign in to your OrderOps AI workspace
        </div>

        <div id="errorBox" class="error"></div>

        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Sign In
            </button>

        </form>


        <div class="register">
            Don't have an account?
            <a href="register.html">
                Create Account
            </a>
        </div>

    </div>


    <div class="brand">
        OrderOps AI • Autonomous Order Operations
    </div>

</div>


<script src="js/api.js"></script>

<script>

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("errorBox");

const showPassword =
    document.getElementById("showPassword");


showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            showPassword.textContent =
                "Hide";

        } else {

            passwordInput.type = "password";

            showPassword.textContent =
                "Show";
        }

    }
);


loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        errorBox.style.display = "none";

        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";


        try {

            const response =
                await apiFetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        body: {
                            email:
                                emailInput.value
                                    .trim()
                                    .toLowerCase(),

                            password:
                                passwordInput.value
                        }
                    }
                );


            if (
                !response ||
                !response.access_token
            ) {

                throw new Error(
                    "Login succeeded but no access token was returned."
                );
            }


            localStorage.setItem(
                "access_token",
                response.access_token
            );


            localStorage.setItem(
                "orderops_user",
                JSON.stringify(
                    response.user || {}
                )
            );


            window.location.href =
                "dashboard.html";


        } catch (error) {

            errorBox.textContent =
                error.message ||
                "Invalid email or password.";

            errorBox.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Sign In";
        }

    }
);

</script>

</body>
</html>

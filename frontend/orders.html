<main class="main">

<div class="topbar">

<div>

<h1 class="page-title">
Orders
</h1>

<div class="page-subtitle">
Create and manage customer orders
</div>

</div>

</div>


<!-- CREATE ORDER -->

<div class="card">

<h2 class="card-title">
Create New Order
</h2>

<br>


<form id="orderForm"
class="form-grid">


<div class="field">

<label>Customer ID *</label>

<input
id="customerId"
type="number"
min="1"
required
placeholder="1">

</div>


<div class="field">

<label>Product ID *</label>

<input
id="productId"
type="number"
min="1"
required
placeholder="1">

</div>


<div class="field">

<label>Quantity *</label>

<input
id="quantity"
type="number"
min="1"
value="1"
required>

</div>


<div class="field">

<label>Unit Price *</label>

<input
id="unitPrice"
type="number"
min="0"
step="0.01"
required
placeholder="250">

</div>


<div class="actions">

<button
class="btn"
type="submit">

Create Order

</button>

</div>

</form>

</div>


<!-- ORDERS -->

<div class="card">

<div class="toolbar">

<h2 class="card-title">
All Orders
</h2>

<button
class="btn btn-secondary"
onclick="loadOrders()">

Refresh

</button>

</div>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Order</th>
<th>Customer</th>
<th>Amount</th>
<th>Risk</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

</main>


<script src="js/api.js"></script>


<script>


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    try {

        const orders =
            await apiFetch(
                "/api/orders/"
            );


        document.getElementById(
            "rows"
        ).innerHTML = orders.length

            ? orders.map(order => `

                <tr>

                    <td>

                        <strong>
                        ${escapeHtml(
                            order.order_number
                        )}
                        </strong>

                    </td>


                    <td>
                        ${escapeHtml(
                            order.customer_name ||
                            "Unknown Customer"
                        )}
                    </td>


                    <td>
                        ${money(
                            order.total_amount || 0
                        )}
                    </td>


                    <td>

                        <span class="badge
                        ${
                            order.risk_level === "high"
                            ? "badge-red"
                            :
                            order.risk_level === "medium"
                            ? "badge-yellow"
                            :
                            "badge-green"
                        }">

                        ${order.risk_score || 0}
                        /
                        ${escapeHtml(
                            order.risk_level || "low"
                        )}

                        </span>

                    </td>


                    <td>

                        <span class="badge">

                        ${escapeHtml(
                            order.status || "pending"
                        )}

                        </span>

                    </td>


                    <td>

                        <div class="actions">


                            <!-- PRINT -->

                            <button
                            class="btn btn-secondary"
                            onclick="printOrder(${order.id})">

                            🖨 Print

                            </button>


                            <!-- AI -->

                            <button
                            class="btn"
                            onclick="processAI(${order.id})">

                            🤖 AI Process

                            </button>


                            <!-- FULFILL -->

                            <button
                            class="btn btn-success"
                            onclick="fulfillOrder(${order.id})">

                            ✓ Fulfill

                            </button>


                            <!-- DELETE -->

                            <button
                            class="btn btn-danger"
                            onclick="deleteOrder(${order.id})">

                            🗑 Delete

                            </button>


                        </div>

                    </td>

                </tr>

            `).join("")

            :

            `
                <tr>

                    <td colspan="6"
                        class="empty">

                        No orders found.

                    </td>

                </tr>
            `;

    }

    catch(error) {

        alert(error.message);

    }

}


/* =====================================================
   PRINT ORDER
===================================================== */

function printOrder(id) {

    window.open(
        `print/order-print.html?id=${id}`,
        "_blank"
    );

}


/* =====================================================
   AI PROCESS
===================================================== */

async function processAI(id) {

    try {

        const result =
            await apiFetch(
                `/api/agents/orders/${id}/process`,
                {
                    method: "POST"
                }
            );


        alert(
            result
            ?.result
            ?.resolution
            ?.message
            ||
            "AI processing completed."
        );


        loadOrders();

    }

    catch(error) {

        alert(error.message);

    }

}


/* =====================================================
   FULFILL ORDER
===================================================== */

async function fulfillOrder(id) {

    try {

        const result =
            await apiFetch(
                `/api/agents/orders/${id}/fulfill`,
                {
                    method: "POST"
                }
            );


        alert(
            result
            ?.result
            ?.message
            ||
            "Fulfillment processed."
        );


        loadOrders();

    }

    catch(error) {

        alert(error.message);

    }

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(id) {

    if (!confirm(
        "Are you sure you want to delete this order?"
    )) {

        return;

    }


    try {

        await apiFetch(
            `/api/orders/${id}`,
            {
                method: "DELETE"
            }
        );


        alert(
            "Order deleted successfully."
        );


        loadOrders();

    }

    catch(error) {

        alert(error.message);

    }

}


/* =====================================================
   CREATE ORDER
===================================================== */

document.getElementById(
    "orderForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        try {

            await apiFetch(
                "/api/orders/",
                {

                    method: "POST",

                    body: {

                        customer_id:
                            Number(
                                document
                                .getElementById(
                                    "customerId"
                                )
                                .value
                            ),

                        items: [

                            {

                                product_id:
                                    Number(
                                        document
                                        .getElementById(
                                            "productId"
                                        )
                                        .value
                                    ),

                                quantity:
                                    Number(
                                        document
                                        .getElementById(
                                            "quantity"
                                        )
                                        .value
                                    ),

                                unit_price:
                                    Number(
                                        document
                                        .getElementById(
                                            "unitPrice"
                                        )
                                        .value
                                    )

                            }

                        ]

                    }

                }
            );


            alert(
                "Order created successfully."
            );


            this.reset();


            document.getElementById(
                "quantity"
            ).value = 1;


            await loadOrders();

        }

        catch(error) {

            alert(error.message);

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "access_token"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   START
===================================================== */

if (requireAuth()) {

    loadOrders();

}


</script>

</body>

</html>
